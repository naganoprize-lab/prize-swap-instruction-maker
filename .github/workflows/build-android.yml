name: Android offline companion APK
on:
  push:
    branches: ['**']
    paths: ['android/**', 'shared/**', 'scripts/verify_mobile_roundtrip.py', '.github/workflows/build-android.yml']
  pull_request:
    paths: ['android/**', 'shared/**', 'scripts/verify_mobile_roundtrip.py', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, APK and UI test APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Kotlin to Windows data compatibility
        run: |
          python -m pip install -r requirements.txt
          python scripts/verify_mobile_roundtrip.py android/app/build/outputs/interop/android-roundtrip.zip
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Android-test-results
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/interop/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: PrizeSwapCompanion-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
