name: Windows portable EXE
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build portable EXE
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --noupx --name PrizeSwapInstructionMaker main.py
      - name: Verify artifact
        shell: pwsh
        run: |
          if (!(Test-Path dist/PrizeSwapInstructionMaker.exe)) { throw "EXE missing" }
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/PrizeSwapInstructionMaker.exe,dist/README.md -DestinationPath PrizeSwapInstructionMaker-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PrizeSwapInstructionMaker-windows-x64
          path: PrizeSwapInstructionMaker-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PrizeSwapInstructionMaker-windows-x64
          path: release
      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/PrizeSwapInstructionMaker-windows-x64.zip --clobber
