name: Windows portable EXE
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare verified Japanese CI font
        run: python scripts/prepare_ci_fonts.py build-fonts
      - name: PDF font and rendering diagnostics
        id: pdf_diagnostics
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m prize_swap.pdf_diagnostics build-diagnostics
      - uses: actions/upload-artifact@v6
        if: ${{ always() && hashFiles('build-diagnostics/**') != '' }}
        with:
          name: PDF-diagnostics
          path: build-diagnostics/
          if-no-files-found: error
      - name: PDF regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q --junitxml=build-tests/pdf-regression.xml
          tests/test_floor.py::test_floor_colors_and_pdf
          'tests/test_printing.py::test_real_pdf_a4_japanese_multipage_and_every_product[column]'
          'tests/test_printing.py::test_real_pdf_a4_japanese_multipage_and_every_product[row]'
          tests/test_printing.py::test_page_range_and_reverse_order
          tests/test_booth_planning.py::test_pdf_plans_are_once_per_product_and_merged_geometry_is_visible
          tests/test_booth_planning.py::test_labels_warn_on_plan_difference_but_print_only_names
          tests/test_booth_planning.py::test_direct_print_dialog_uses_same_machine_and_plan_renderer
          tests/test_pdf_text.py
          tests/test_print_optimization.py
          tests/test_floor_operations.py
          tests/test_floor_printing.py
          tests/test_floor_workspace.py
          tests/test_floor_control_print.py
          tests/test_floor_color_filters.py
          tests/test_sales_analysis.py
          tests/test_analysis_integration.py
          tests/test_replacement_analysis.py
          tests/test_performance_history.py
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=build-tests/pytest.xml
      - uses: actions/upload-artifact@v6
        if: ${{ always() && hashFiles('build-tests/**') != '' }}
        with:
          name: Pytest-results
          path: build-tests/
          if-no-files-found: error
      - name: Native Windows fullscreen and high DPI validation
        timeout-minutes: 5
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          foreach ($scale in @('1', '1.5', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            $outputPath = "build-visual/native-$scale"
            python -m prize_swap.floor_visual_check $outputPath
            $code = $LASTEXITCODE
            if (!(Test-Path "$outputPath/report.json")) { throw "Native visual check produced no report ($scale)" }
            $report = Get-Content "$outputPath/report.json" -Raw | ConvertFrom-Json
            if ($code -ne 0 -or !$report.ok -or $report.platform -ne 'windows') {
              Write-Output "::error::$($report.error -replace "`n", ' | ')"
              throw "Windows native visual check failed ($scale)"
            }
          }
      - uses: actions/upload-artifact@v6
        if: ${{ always() && hashFiles('build-visual/**') != '' }}
        with:
          name: Windows-native-visual-validation
          path: build-visual/
          if-no-files-found: error
      - name: Build portable EXE
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --noupx --name PrizeSwapInstructionMaker main.py
      - name: Smoke test packaged Windows EXE
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path dist/PrizeSwapInstructionMaker.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', 'build-smoke') -PassThru
          if (!$process.WaitForExit(120000)) {
            $process.Kill()
            throw "Packaged EXE smoke test timed out"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Packaged EXE smoke test failed: $($process.ExitCode)" }
          if (!(Test-Path build-smoke/report.json)) { throw "EXE did not create build-smoke/report.json" }
          $report = Get-Content build-smoke/report.json -Raw | ConvertFrom-Json
          if (!$report.ok) { throw "EXE validation failed" }
      - name: Native packaged EXE fullscreen at 200 percent DPI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '2'
        run: |
          $exe = (Resolve-Path dist/PrizeSwapInstructionMaker.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--floor-visual-test', 'build-smoke/native-200') -PassThru
          if (!$process.WaitForExit(120000)) {
            $process.Kill()
            throw "Native EXE visual test timed out"
          }
          $process.Refresh()
          if (!(Test-Path build-smoke/native-200/report.json)) { throw "Native EXE visual report missing" }
          $report = Get-Content build-smoke/native-200/report.json -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or !$report.ok -or $report.platform -ne 'windows') {
            Write-Output "::error::$($report.error -replace "`n", ' | ')"
            throw "Native packaged EXE visual check failed"
          }
      - uses: actions/upload-artifact@v6
        if: ${{ always() && hashFiles('build-smoke/**') != '' }}
        with:
          name: Windows-validation
          path: build-smoke/
          if-no-files-found: error
      - name: Verify artifact
        shell: pwsh
        run: |
          if (!(Test-Path dist/PrizeSwapInstructionMaker.exe)) { throw "EXE missing" }
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/PrizeSwapInstructionMaker.exe,dist/README.md -DestinationPath PrizeSwapInstructionMaker-windows-x64.zip
          $zipPath = (Resolve-Path PrizeSwapInstructionMaker-windows-x64.zip).Path
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            foreach ($name in @('PrizeSwapInstructionMaker.exe', 'README.md')) {
              $entry = $zip.GetEntry($name)
              if ($null -eq $entry -or $entry.Length -eq 0) { throw "ZIP entry missing or empty: $name" }
            }
          } finally { $zip.Dispose() }
      - uses: actions/upload-artifact@v6
        with:
          name: PrizeSwapInstructionMaker-windows-x64
          path: PrizeSwapInstructionMaker-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: PrizeSwapInstructionMaker-windows-x64
          path: release
      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/PrizeSwapInstructionMaker-windows-x64.zip --clobber
